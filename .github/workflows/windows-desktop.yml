name: Windows Desktop

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      web_url:
        description: "URL HTTPS pública do Lunira Screen"
        required: true
        type: string
      version:
        description: "Versão do app (ex.: 1.2.0)"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      LUNIRA_WEB_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.web_url || vars.LUNIRA_WEB_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve release version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $version = "${{ github.event.release.tag_name }}" -replace '^v', ''
          } else {
            $version = "${{ inputs.version }}" -replace '^v', ''
          }

          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Versão inválida: $version. Use algo como 1.2.0 ou 1.2.0-beta.1."
          }

          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate public web URL
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LUNIRA_WEB_URL)) {
            throw "LUNIRA_WEB_URL não configurada. Em releases automáticas, crie a variável de repositório LUNIRA_WEB_URL em Settings > Secrets and variables > Actions > Variables."
          }

          $uri = $null
          if (-not [Uri]::TryCreate($env:LUNIRA_WEB_URL, [UriKind]::Absolute, [ref]$uri)) {
            throw "LUNIRA_WEB_URL não é uma URL válida."
          }

          if ($uri.Scheme -ne "https") {
            throw "O build de release exige LUNIRA_WEB_URL com HTTPS."
          }

      - name: Set desktop package version
        shell: pwsh
        run: |
          node -e "const fs=require('fs');const p='desktop/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.env.APP_VERSION;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist -- --x64

      - name: Verify installer
        shell: pwsh
        run: |
          $files = Get-ChildItem "desktop/release/*.exe" -ErrorAction SilentlyContinue
          if (-not $files) {
            throw "electron-builder não gerou nenhum .exe."
          }
          $files | ForEach-Object {
            Write-Host "$($_.Name) - $([math]::Round($_.Length / 1MB, 2)) MB"
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lunira-Screen-Windows-${{ env.APP_VERSION }}
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach installer to GitHub Release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" desktop/release/*.exe --clobber
