name: Windows Desktop

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      web_url:
        description: "URL HTTPS pública do Lunira Screen"
        required: false
        default: "https://lunira-screen.onrender.com/"
        type: string
      version:
        description: "Versão do app (ex.: 1.2.0)"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      LUNIRA_WEB_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.web_url || vars.LUNIRA_WEB_URL || 'https://lunira-screen.onrender.com/' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve release version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $version = "${{ github.event.release.tag_name }}" -replace '^v', ''
          } else {
            $version = "${{ inputs.version }}" -replace '^v', ''
          }

          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Versão inválida: $version."
          }

          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }

      - name: Build Windows installer
        shell: pwsh
        working-directory: desktop
        run: .\scripts\build.ps1 -Version $env:APP_VERSION -WebUrl $env:LUNIRA_WEB_URL

      - name: Verify installer
        shell: pwsh
        run: |
          $files = Get-ChildItem "desktop/release/*.exe" -ErrorAction SilentlyContinue
          if (-not $files) {
            throw "O instalador Windows não foi gerado."
          }
          $files | ForEach-Object {
            Write-Host "$($_.Name) - $([math]::Round($_.Length / 1MB, 2)) MB"
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lunira-Screen-Windows-${{ env.APP_VERSION }}
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach installer to GitHub Release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" desktop/release/*.exe --clobber
