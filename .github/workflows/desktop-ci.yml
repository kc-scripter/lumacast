name: Desktop CI

on:
  push:
    branches: [feature/desktop-current-v1, feature/desktop-0.1.14-room-redesign]
    paths:
      - "desktop/**"
      - "client/src/services/**"
      - "server/**"
      - "client/src/components/**"
      - "client/src/types.ts"
      - "tests/desktop-cross-platform-smoke.mjs"
      - "tests/security-smoke.mjs"
      - "tests/signaling-degraded-smoke.mjs"
      - "tests/desktop-visual-smoke.mjs"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    branches: [feature/desktop-current-v1, main]
    paths:
      - "desktop/**"
      - "client/src/services/**"
      - "server/**"
      - "client/src/components/**"
      - "client/src/types.ts"
      - "tests/desktop-cross-platform-smoke.mjs"
      - "tests/security-smoke.mjs"
      - "tests/signaling-degraded-smoke.mjs"
      - "tests/desktop-visual-smoke.mjs"
      - ".github/workflows/desktop-ci.yml"
  workflow_dispatch:

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cross-platform-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PORT: "3001"
      CLIENT_ORIGIN: "http://localhost:5173"
      PUBLIC_URL: "http://localhost:5173"
      AGORA_APP_ID: "11111111111111111111111111111111"
      AGORA_APP_CERTIFICATE: "22222222222222222222222222222222"
      LIVEKIT_URL: "wss://example.invalid"
      LIVEKIT_API_KEY: "ci-key"
      LIVEKIT_API_SECRET: "ci-secret"
      TRUST_PROXY_HOPS: "0"
      MAX_ROOM_PARTICIPANTS: "8"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify existing web/client type safety
        run: npm run typecheck
      - name: Verify existing web production build
        run: npm run build:client
      - run: npm run build:server
      - name: Verify Desktop ↔ Web signaling contract
        shell: bash
        run: |
          node server/dist/server.js > /tmp/lunira-desktop-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; cat /tmp/lunira-desktop-server.log' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://localhost:3001/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:3001/api/health
          node tests/desktop-cross-platform-smoke.mjs
          node tests/security-smoke.mjs
      - name: Verify signaling fallback without RTC credentials
        shell: bash
        run: |
          unset AGORA_APP_ID AGORA_APP_CERTIFICATE LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET
          PORT=3002 node server/dist/server.js > /tmp/lunira-degraded-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; cat /tmp/lunira-degraded-server.log' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://localhost:3002/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:3002/api/health
          TEST_SIGNALING_URL=http://localhost:3002 node tests/signaling-degraded-smoke.mjs

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install web/shared dependencies
        run: npm ci
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Audit desktop dependencies
        working-directory: desktop
        run: npm audit --audit-level=high
      - name: Validate desktop version
        id: desktop_version
        working-directory: desktop
        shell: pwsh
        run: |
          npm run version:check
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Typecheck desktop
        working-directory: desktop
        run: npm run typecheck
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare Windows code signing
        id: windows_signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Host "Trusted Windows signing certificate is not configured."
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "lunira-signing.pfx"
          $configPath = Join-Path $env:RUNNER_TEMP "tauri-signing.json"
          $certificateBytes = [Convert]::FromBase64String(($env:WINDOWS_CERTIFICATE -replace '\s',''))
          [IO.File]::WriteAllBytes($pfxPath, $certificateBytes)
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate -or -not $certificate.HasPrivateKey) { throw "Windows signing certificate has no usable private key." }
          $config = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Depth 6
          Set-Content -LiteralPath $configPath -Value $config -Encoding utf8
          "enabled=true" >> $env:GITHUB_OUTPUT
          "config=$configPath" >> $env:GITHUB_OUTPUT
      - name: Build Windows installer
        working-directory: desktop
        shell: pwsh
        run: |
          if ('${{ steps.windows_signing.outputs.enabled }}' -eq 'true') {
            npm run tauri:build -- --config '${{ steps.windows_signing.outputs.config }}'
          } else {
            npm run tauri:build
          }
      - name: Verify Windows signatures
        if: steps.windows_signing.outputs.enabled == 'true'
        working-directory: desktop
        shell: pwsh
        run: |
          $targets = @(
            Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File
            Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" -File | Where-Object { $_.DirectoryName -notmatch 'bundle' }
          )
          if (-not $targets) { throw "No Windows executables found for signature verification." }
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature: $($target.Name) ($($signature.Status))" }
          }
      - name: Upload Windows installer
        id: upload_desktop
        uses: actions/upload-artifact@v6
        with:
          name: lunira-screen-desktop-v${{ steps.desktop_version.outputs.version }}-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30


  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PORT: "3001"
      CLIENT_ORIGIN: "http://127.0.0.1:1420"
      PUBLIC_URL: "http://127.0.0.1:1420"
      AGORA_APP_ID: "11111111111111111111111111111111"
      AGORA_APP_CERTIFICATE: "22222222222222222222222222222222"
      LIVEKIT_URL: "wss://example.invalid"
      LIVEKIT_API_KEY: "ci-key"
      LIVEKIT_API_SECRET: "ci-secret"
      TRUST_PROXY_HOPS: "0"
      MAX_ROOM_PARTICIPANTS: "8"
      DESKTOP_PREVIEW_URL: "http://127.0.0.1:1420"
      DESKTOP_VISUAL_DIR: "/tmp/lunira-visual"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:server
      - name: Install desktop and visual QA dependencies
        shell: bash
        run: |
          cd desktop
          npm install
          cd ..
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local signaling and desktop preview
        shell: bash
        run: |
          node server/dist/server.js > /tmp/lunira-server.log 2>&1 &
          echo $! > /tmp/lunira-server.pid
          (
            cd desktop
            VITE_SIGNALING_URL=http://127.0.0.1:3001 VITE_PUBLIC_WEB_URL=http://127.0.0.1:1420 npm run dev -- --host 127.0.0.1 > /tmp/lunira-vite.log 2>&1
          ) &
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:1420 >/dev/null && curl --fail --silent http://127.0.0.1:3001/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lunira-server.log || true
          cat /tmp/lunira-vite.log || true
          exit 1
      - name: Capture 1280x800 desktop UI
        run: node tests/desktop-visual-smoke.mjs
      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@v6
        with:
          name: lunira-desktop-visual-qa
          path: /tmp/lunira-visual/*.png
          if-no-files-found: error
          retention-days: 3
