name: Desktop CI

on:
  push:
    branches: [feature/desktop-current-v1]
    paths:
      - "desktop/**"
      - "client/src/services/**"
      - "client/src/components/**"
      - "client/src/types.ts"
      - "tests/desktop-cross-platform-smoke.mjs"
      - "tests/desktop-visual-smoke.mjs"
      - ".github/workflows/desktop-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  cross-platform-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PORT: "3001"
      CLIENT_ORIGIN: "http://localhost:5173"
      PUBLIC_URL: "http://localhost:5173"
      AGORA_APP_ID: "11111111111111111111111111111111"
      AGORA_APP_CERTIFICATE: "22222222222222222222222222222222"
      LIVEKIT_URL: "wss://example.invalid"
      LIVEKIT_API_KEY: "ci-key"
      LIVEKIT_API_SECRET: "ci-secret"
      TRUST_PROXY_HOPS: "0"
      MAX_ROOM_PARTICIPANTS: "8"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify existing web/client type safety
        run: npm run typecheck
      - name: Verify existing web production build
        run: npm run build:client
      - run: npm run build:server
      - name: Verify Desktop ↔ Web signaling contract
        shell: bash
        run: |
          node server/dist/server.js > /tmp/lunira-desktop-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; cat /tmp/lunira-desktop-server.log' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://localhost:3001/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:3001/api/health
          node tests/desktop-cross-platform-smoke.mjs

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install web/shared dependencies
        run: npm ci
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Validate desktop version
        id: desktop_version
        working-directory: desktop
        shell: pwsh
        run: |
          npm run version:check
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Typecheck desktop
        working-directory: desktop
        run: npm run typecheck
      - name: Build desktop frontend
        working-directory: desktop
        run: npm run build
      - name: Build Windows installer
        working-directory: desktop
        run: npm run tauri:build
      - name: Upload Windows installer
        id: upload_desktop
        uses: actions/upload-artifact@v6
        with:
          name: lunira-screen-desktop-v${{ steps.desktop_version.outputs.version }}-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Delete older desktop installer artifacts
        if: ${{ success() }}
        uses: actions/github-script@v7
        with:
          script: |
            const prefix = "lunira-screen-desktop-";
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const currentIds = new Set(
              data.artifacts
                .filter(a => a.workflow_run?.id === context.runId && a.name.startsWith(prefix))
                .map(a => a.id)
            );
            for (const artifact of data.artifacts) {
              if (!artifact.name.startsWith(prefix)) continue;
              if (currentIds.has(artifact.id)) continue;
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
              core.info("Deleted old desktop artifact: " + artifact.name + " (" + artifact.id + ")");
            }


  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PORT: "3001"
      CLIENT_ORIGIN: "http://127.0.0.1:1420"
      PUBLIC_URL: "http://127.0.0.1:1420"
      AGORA_APP_ID: "11111111111111111111111111111111"
      AGORA_APP_CERTIFICATE: "22222222222222222222222222222222"
      LIVEKIT_URL: "wss://example.invalid"
      LIVEKIT_API_KEY: "ci-key"
      LIVEKIT_API_SECRET: "ci-secret"
      TRUST_PROXY_HOPS: "0"
      MAX_ROOM_PARTICIPANTS: "8"
      DESKTOP_PREVIEW_URL: "http://127.0.0.1:1420"
      DESKTOP_VISUAL_DIR: "/tmp/lunira-visual"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:server
      - name: Install desktop and visual QA dependencies
        shell: bash
        run: |
          cd desktop
          npm install
          cd ..
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local signaling and desktop preview
        shell: bash
        run: |
          node server/dist/server.js > /tmp/lunira-server.log 2>&1 &
          echo $! > /tmp/lunira-server.pid
          (
            cd desktop
            VITE_SIGNALING_URL=http://127.0.0.1:3001 VITE_PUBLIC_WEB_URL=http://127.0.0.1:1420 npm run dev -- --host 127.0.0.1 > /tmp/lunira-vite.log 2>&1
          ) &
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:1420 >/dev/null && curl --fail --silent http://127.0.0.1:3001/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lunira-server.log || true
          cat /tmp/lunira-vite.log || true
          exit 1
      - name: Capture 1280x800 desktop UI
        run: node tests/desktop-visual-smoke.mjs
      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@v6
        with:
          name: lunira-desktop-visual-qa
          path: /tmp/lunira-visual/*.png
          if-no-files-found: error
          retention-days: 3
