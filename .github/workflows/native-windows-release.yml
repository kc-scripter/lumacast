name: Native Windows Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: cmake -S native-windows -B native-windows/build -A x64
      - name: Build native diagnostics
        shell: pwsh
        run: cmake --build native-windows/build --config Release --parallel
      - name: Verify
        shell: pwsh
        run: |
          & "native-windows/build/Release/LuniraSignalingSmoke.exe"
          if ($LASTEXITCODE -ne 0) { throw "Signaling smoke failed." }
          & "native-windows/build/Release/LuniraAgoraRoundtrip.exe" --loader-probe
          if ($LASTEXITCODE -ne 0) { throw "Agora loader probe failed." }
