name: Windows Desktop Check

on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/windows-desktop.yml"
      - ".github/workflows/windows-desktop-check.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      LUNIRA_WEB_URL: https://lunira-screen.onrender.com/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }

      - name: Build lightweight Windows app
        shell: pwsh
        working-directory: desktop
        run: .\scripts\build.ps1 -Version "1.0.0" -WebUrl $env:LUNIRA_WEB_URL

      - name: Verify installer
        shell: pwsh
        run: |
          $files = Get-ChildItem "desktop/release/*.exe" -ErrorAction SilentlyContinue
          if (-not $files) {
            throw "O instalador Windows não foi gerado."
          }
          $files | ForEach-Object {
            Write-Host "$($_.Name) - $([math]::Round($_.Length / 1MB, 2)) MB"
          }

      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: Lunira-Screen-Windows-PR
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 7
