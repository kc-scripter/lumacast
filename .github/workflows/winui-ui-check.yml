name: WinUI Desktop UI

on:
  pull_request:
    paths:
      - "desktop-winui/**"
      - "native-windows/**"
      - ".github/workflows/winui-ui-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build native core bridge
        shell: pwsh
        run: |
          cmake -S native-windows -B native-windows/build -A x64
          cmake --build native-windows/build --config Release --target LuniraCoreBridge LuniraUpdater

      - name: Restore WinUI packages
        shell: pwsh
        run: |
          nuget restore desktop-winui/LuniraScreen.UI.sln -PackagesDirectory desktop-winui/packages -NonInteractive

      - name: Build WinUI Release
        shell: pwsh
        run: |
          msbuild desktop-winui/LuniraScreen.UI.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Verify executable
        shell: pwsh
        run: |
          $out = "desktop-winui/bin/Release/x64"
          $exe = "$out/LuniraScreen-WinUI.exe"
          if (-not (Test-Path $exe)) { throw "WinUI executable was not produced." }
          Copy-Item "native-windows/build/Release/*.dll" $out -Force
          Copy-Item "native-windows/build/Release/LuniraUpdater.exe" $out -Force
          if (-not (Test-Path "$out/LuniraCoreBridge.dll")) { throw "Core bridge was not packaged." }
          Write-Host "WinUI EXE: $((Get-Item $exe).Length) bytes"

      - name: Upload WinUI preview
        uses: actions/upload-artifact@v4
        with:
          name: LuniraScreen-WinUI
          path: desktop-winui/bin/Release/x64/
          if-no-files-found: error
          retention-days: 7
