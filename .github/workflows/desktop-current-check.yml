name: Desktop Current Recovery
# CI bootstrap: workflow is enabled on main so PR builds can run.

on:
  pull_request:
    paths:
      - "desktop-current/**"
      - "server/src/server.ts"
      - ".github/workflows/desktop-current-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-shell:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare polished frontend
        run: python desktop-current/tools/build_frontend.py
      - name: Validate desktop frontend invariants
        shell: pwsh
        run: |
          $js = Get-Content "desktop-current/dist/assets/index-Dm-7PBzL.js" -Raw
          $html = Get-Content "desktop-current/dist/index.html" -Raw
          if ($js.Contains("https://lunira-screen.onrender.com")) { throw "Invalid signaling endpoint returned." }
          if (-not $js.Contains("https://lunirascreen.onrender.com")) { throw "Production signaling endpoint missing." }
          if (-not $js.Contains("children:_e.length")) { throw "Participant rail patch missing." }
          if (-not $html.Contains("polish.css") -or -not $html.Contains("polish.js")) { throw "Polish assets were not injected." }
      - name: Check reconstructed Tauri shell
        run: cargo check --manifest-path desktop-current/src-tauri/Cargo.toml

  recovery-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate recovery and polish scripts
        run: |
          python -m py_compile desktop-current/recovery/extract_v0_3_0.py
          python -m py_compile desktop-current/tools/build_frontend.py
          python desktop-current/tools/build_frontend.py

  package-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    needs:
      - rust-shell
      - recovery-script
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare polished frontend
        run: python desktop-current/tools/build_frontend.py
      - name: Install Tauri CLI
        run: npm install --prefix desktop-current --no-audit --no-fund
      - name: Build Windows NSIS installer
        run: npm --prefix desktop-current run tauri -- build
      - name: Verify installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem "desktop-current/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer was not produced." }
          Write-Host "Installer: $($setup.Name) / $([math]::Round($setup.Length / 1MB, 2)) MB"
      - name: Upload polished Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Lunira-Screen-Desktop-v0.3.1-native-capture
          path: desktop-current/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
