name: Android APK

on:
  push:
    branches:
      - main
      - feature/android-app
    paths:
      - "android-app/**"
      - "client/**"
      - ".github/workflows/android-app.yml"
  pull_request:
    paths:
      - "android-app/**"
      - "client/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Install Android shell dependencies
        run: npm install --prefix android-app --no-audit --no-fund

      - name: Typecheck shared frontend
        run: npm run typecheck

      - name: Build Android web bundle
        run: npm --prefix android-app run prepare:web

      - name: Initialize Android project
        run: npm --prefix android-app run android:init

      - name: Sync Capacitor
        run: npm --prefix android-app run android:sync

      - name: Build debug APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: test -f android-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lunira-Screen-Android-v0.1.0-debug
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
