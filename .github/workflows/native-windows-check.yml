name: Native Windows UI

on:
  pull_request:
    paths:
      - "native-windows/**"
      - ".github/workflows/native-windows-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: cmake -S native-windows -B native-windows/build -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build native-windows/build --config Release --parallel

      - name: Report executable size
        shell: pwsh
        run: |
          $exe = Get-Item "native-windows/build/Release/LuniraScreen.exe"
          Write-Host "LuniraScreen.exe: $([math]::Round($exe.Length / 1KB, 1)) KB"
          if ($exe.Length -gt 5MB) {
            throw "UI shell ficou maior que 5 MB; revisar dependências."
          }

      - name: Cross-client signaling smoke
        shell: pwsh
        run: |
          $exe = "native-windows/build/Release/LuniraSignalingSmoke.exe"
          & $exe
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Primeira tentativa falhou; aguardando possível cold start do Render..."
            Start-Sleep -Seconds 8
            & $exe
          }
          if ($LASTEXITCODE -ne 0) {
            throw "O cliente nativo não conseguiu criar + entrar na mesma sala do backend web."
          }

      - name: LiveKit native media smoke
        shell: pwsh
        run: |
          $exe = "native-windows/build/Release/LuniraLiveKitSmoke.exe"
          & $exe
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Primeira conexão LiveKit falhou; aguardando possível cold start..."
            Start-Sleep -Seconds 8
            & $exe
          }
          if ($LASTEXITCODE -ne 0) {
            throw "O cliente nativo não conseguiu conectar ao mesmo LiveKit usado pela versão web."
          }

      - name: Native camera frame roundtrip
        shell: pwsh
        run: |
          $exe = "native-windows/build/Release/LuniraCameraRoundtrip.exe"
          & $exe
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Primeira tentativa de vídeo falhou; repetindo após alguns segundos..."
            Start-Sleep -Seconds 6
            & $exe
          }
          if ($LASTEXITCODE -ne 0) {
            throw "O receptor usado pelo app não recebeu um frame de câmera LiveKit de ponta a ponta."
          }

      - name: Report LiveKit runtime size
        shell: pwsh
        run: |
          $files = Get-ChildItem "native-windows/build/Release/*.dll" -ErrorAction SilentlyContinue
          if (-not $files) {
            throw "As DLLs do LiveKit não foram copiadas para o build."
          }
          $total = ($files | Measure-Object -Property Length -Sum).Sum
          $files | ForEach-Object {
            Write-Host "$($_.Name): $([math]::Round($_.Length / 1MB, 2)) MB"
          }
          Write-Host "LiveKit runtime total: $([math]::Round($total / 1MB, 2)) MB"

      - name: Stage runnable preview
        shell: pwsh
        run: |
          $source = "native-windows/build/Release"
          $stage = "native-windows/package"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$source/LuniraScreen.exe" $stage
          Copy-Item "$source/livekit.dll" $stage
          Copy-Item "$source/livekit_ffi.dll" $stage

      - name: Upload native preview
        uses: actions/upload-artifact@v4
        with:
          name: Lunira-Screen-Native-UI
          path: native-windows/package/
          if-no-files-found: error
          retention-days: 7
