name: Native Windows App

on:
  pull_request:
    paths:
      - "native-windows/**"
      - ".github/workflows/native-windows-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: cmake -S native-windows -B native-windows/build -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build native-windows/build --config Release --parallel

      - name: Updater helper self-test
        shell: pwsh
        run: |
          & "native-windows/build/Release/LuniraUpdater.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "LuniraUpdater self-test falhou." }

      - name: Production endpoint diagnostics
        shell: pwsh
        run: |
          & "native-windows/build/Release/LuniraSignalingSmoke.exe"
          if ($LASTEXITCODE -ne 0) { throw "Falhou o signaling nativo." }
          & "native-windows/build/Release/LuniraLiveKitSmoke.exe"
          if ($LASTEXITCODE -ne 0) { throw "Falhou a conexão LiveKit nativa." }

      - name: Media roundtrips
        shell: pwsh
        run: |
          & "native-windows/build/Release/LuniraCameraRoundtrip.exe"
          if ($LASTEXITCODE -ne 0) { throw "Falhou o roundtrip LiveKit." }
          & "native-windows/build/Release/LuniraAgoraRoundtrip.exe"
          if ($LASTEXITCODE -ne 0) { throw "Falhou o roundtrip Agora." }

      - name: Stage native application
        shell: pwsh
        run: |
          $release = "native-windows/build/Release"
          $stage = "native-windows/package"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "$release/LuniraScreen.exe" $stage
          Copy-Item "$release/LuniraUpdater.exe" $stage
          Get-ChildItem $release -Filter *.dll | Copy-Item -Destination $stage
          Write-Host "Native package:"
          Get-ChildItem $stage | Select-Object Name,Length

      - name: Upload native app
        uses: actions/upload-artifact@v4
        with:
          name: LuniraScreen-Native
          path: native-windows/package/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload native diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: LuniraScreen-Native-Core
          path: |
            native-windows/build/Release/LuniraSignalingSmoke.exe
            native-windows/build/Release/LuniraLiveKitSmoke.exe
            native-windows/build/Release/LuniraCameraRoundtrip.exe
            native-windows/build/Release/LuniraAgoraRoundtrip.exe
          if-no-files-found: error
          retention-days: 7
